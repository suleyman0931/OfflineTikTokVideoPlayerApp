name: offline_tiktok_player
description: A TikTok Clone video player developed by Suleyman Abdu.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.8.3
  permission_handler: ^11.3.1
  url_launcher: ^6.2.5        # For clickable email and phone numbers
  google_fonts: ^6.2.1        # For polished, professional typography
  video_thumbnail: ^0.5.3
  share_plus: ^7.1.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  simple_pip_mode: ^1.1.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
